<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Google Meet AI Notetaker</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <div class="card">
    <div class="header">
      <div class="badge">
        <span class="dot" id="statusDot"></span>
        <span id="statusText">Checking status...</span>
      </div>
      <h2>Google Meet Notetaker</h2>
      <p class="subtitle">Live Text-Only AI Insight Capture</p>
    </div>

    <div class="form-group">
      <label for="meetingTitleInput">Meeting Title / Account</label>
      <input type="text" id="meetingTitleInput" placeholder="e.g. Acme Corp Weekly Sync">
    </div>

    <div class="stats-box">
      <div class="stat-item">
        <span class="stat-value" id="lineCount">0</span>
        <span class="stat-label">Speech Entries Captured</span>
      </div>
      <div class="stat-item">
        <span class="stat-value" id="storageMode">0 Audio</span>
        <span class="stat-label">Storage Mode</span>
      </div>
    </div>

    <div class="transcript-preview" id="transcriptPreview">
      <em>Transcript preview will appear here as people speak...</em>
    </div>

    <div class="button-group">
      <button id="btnStart" class="btn btn-primary">Start Live Capture</button>
      <button id="btnStop" class="btn btn-danger" disabled>Stop Capture</button>
    </div>

    <button id="btnSend" class="btn btn-success" disabled>
      <span>✨ Generate AI Insights & Send to Dashboard</span>
    </button>

    <div id="feedbackMessage" class="feedback"></div>
  </div>

  <script src="popup.js"></script>
</body>
</html>
